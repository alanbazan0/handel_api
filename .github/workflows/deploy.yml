name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.3'

      - name: Instalar dependencias
        run: composer install --no-dev --optimize-autoloader --no-security-blocking

      - name: Empaquetar vendor/
        run: zip -r vendor.zip vendor/

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftp
          exclude: |
            **/vendor/**
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/storage/logs/**

      - name: Llamar endpoint post-deploy
        run: curl -f -X POST "${{ secrets.APP_URL }}/post_deploy.php" -d "token=${{ secrets.MIGRATE_TOKEN }}"
