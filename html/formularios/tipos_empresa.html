<div class="modal fade" id="modalAlta" tabindex="-1" role="dialog"
	aria-labelledby="scrollmodalLabel" aria-hidden="true">
	<div class="modal-dialog modal-lg" role="document">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title" id="scrollmodalLabel">Usuario</h5>
				<button type="button" class="close" data-dismiss="modal"
					aria-label="Close">
					<span aria-hidden="true">&times;</span>
				</button>
			</div>
			<div class="modal-body">
				<form id="formulario" action="#" method="post">
					<div class="form-group">
						<div>
							<label>Nombre</label> 
							<input class="campo" id="nombreInput" type="text" maxlength="50" /> 
						</div>
					</div>
					<div class="form-group">
						<div>
							<label>Estatus</label>
							<div>
								<input type="radio" id="estatusRadio" name="estatus" value="1" checked /> 
								<label>ACTIVO</label> <br /> 
								<input type="radio" id="estatusRadio" name="estatus" value="0" /> 
								<label>INACTIVO</label>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
				<button type="submit" class="btn btn-primary" onclick="vista.guardar();">Guardar</button>
			</div>
		</div>
	</div>
</div>
